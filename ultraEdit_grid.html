
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultra Edit clone</title>
     
    <style>
    .box{
         width: 40px; 
         height:23px ;
         background-color: white;

    }
    .box img{
        width: 120px;
    }
    nav{
        display: flex;
        align-items: center;
        justify-content: space-around;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .right ul{
        display: flex;
        gap: 50px;
        
    }
    .right ul li{
        list-style:none;
        display: flex;
        align-items: center;
        cursor: pointer;

        
    }
    .right ul li span{
        padding: 0 9px;
        
    }
    .first{
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap:23px;
        margin: 34px;
        font-family: sans-serif;
    }
    .first span{
        font-size: 35px;
    }
    section span img{
        width: 82px;
        margin: 0 23px;
    }
    .first p{
         font-size: 23px;
         width:44vw;
         text-align: center;
    }
   
    .btn{
        background-color: rgb(41, 169, 249);
        color:aliceblue;
        padding: 14px 16px;
        border-radius: 7px;
        border: none;
        font-family: sans-serif;
        font-weight: 700;
        margin: 12px 0;
        
    }
    .green{
        background-color: rgb(1, 228, 1);
        cursor: pointer;

    }
    .flex{
        display: flex;
        
    }
    .small{
        font-size: 12px;
    }
    .second{
        max-width: 70vw;
        margin: auto;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .item{
        padding: 25px;
        font-size: 20px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        border-radius:12px;
        text-align: center;
        
    }
    .item-lang{
        font-weight: 500;
        text-align: center;
        padding: 30px;
        cursor: pointer;
    }
    .grid{
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 12px;
    }
    .downld:nth-child(2){
        font-size: 90px;
    
    }
    .downld{
        font-family: serif;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
        
    }
    @media screen and (max-width:1145px){
         .grid{
              grid-template-columns: 1fr;
         }
    }
    .btn a{
        text-decoration: none;
        color:white;
    }
    .blue {
    background-color: rgb(41, 169, 249);
    cursor: pointer;
}

    </style>
</head>
<body>
    <header>
        <nav>
            <div class="box">
                <img src="https://www.ultraedit.com/wp-content/uploads/2023/01/Background-2.png" width="120"height="36">
            </div>
            <div class="right">
                <ul>
                   <li><span>Product</span> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="#000000" fill="none">
                   <path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                   </svg>
                   </li> 
                   <li><span>Pricing</span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="#000000" fill="none">
                   <path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                   </svg></li> 
                   <li><span>Resources</span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="#000000" fill="none">
                   <path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                   </svg></li> 
                   <li><span>About</span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="#000000" fill="none">
                   <path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                   </svg></li> 
                   <li><span>Address</span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="#000000" fill="none">
                   <path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
                   </svg></li> 
                </ul>
            </div>
        </nav>
    </header>
    <main>
        <section class="first">
        <span>Download <b>UltraEdit</b> with exciting Features<img width="34" src="https://www.ultraedit.com/wp-content/uploads/2022/11/search1-1.png"></span>
        <div>
            <p>A wealth of functionality that can slot in and out of your workflow..</p>
        
        </div>         
        <button class="btn">DOWNLOAD IT FOR LINUX AND MAC-OS</button>
        </section>
        <section class="second">
            <div class="downld">
                <img src="https://imgs.search.brave.com/JvjacPLCBvzJZ5olvldy1pRYU5_97nbqKWfmyndBgsA/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9jZG4u/YnJhbmRmZXRjaC5p/by9pZHFaV3RVOU45/L3cvNDAwL2gvNDAw/L3RoZW1lL2Rhcmsv/aWNvbi5wbmc_Yz0x/YnhpZDY0TXVwN2Fj/emV3U0FZTVgmdD0x/NzQzNDM5OTcxNzY5"height="40" width="40">
               <span>Download Ultra-Edit</span>
               <span class="small">v.2023(released)</span>
            </div>
            <div class="grid">
                <div class="item">
                    <div class="item-lang">English</div>
                    <button class="btn green">Download 32-bit</button>
                    <button class="btn blue">Download 64-bit</button>
                </div>
                <div class="item">
                    <div class="item-lang">Russian</div>
                    <button class="btn green">Download 32-bit</button>
                    <button class="btn blue">Download 64-bit</button>
                </div>
                <div class="item">
                    <div class="item-lang">Mandarin</div>
                    <button class="btn green">Download 32-bit</button>
                    <button class="btn blue">Download 64-bit</button>
                </div>
                <div class="item">
                    <div class="item-lang">Japanese</div>
                    <button class="btn green">Download 32-bit</button>
                    <button class="btn blue">Download 64-bit</button>
                </div>
                <div class="item">
                    <div class="item-lang">French</div>
                    <button class="btn green">Download 32-bit</button>
                    <button class="btn blue">Download 64-bit</button>
                </div>
                <div class="item">
                    <div class="item-lang">Korean</div>
                    <button class="btn green">Download 32-bit</button>
                    <button class="btn blue">Download 64-bit</button>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
